<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Training</title>
<style>
  :root { --bg: #f5f8f6; --card: #fff; --ink: #1f2b25; --muted: #56665e; --line: #d3e0d9; --brand: #547867; --soft: #eef4f0; --blue: #3f7fd9; --gold: #ffd23f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: 60px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .topbar { background: #111; color: #fff; border-bottom: 5px solid var(--brand); padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
  .topbar .in { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar .ttl { flex: 1; min-width: 180px; }
  .topbar .logo { display: block; height: 13px; width: auto; color: #fff; margin-bottom: 6px; }
  .topbar h1 { margin: 0; font-size: 24px; color: #fff; }
  .back { color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; padding: 10px 14px; border: 2px solid #3a3a3a; border-radius: 12px; background: #1d1d1d; white-space: nowrap; }
  .sync { font-size: 13px; font-weight: 600; color: #bccfc5; display: flex; align-items: center; gap: 6px; }
  .sync .dot { width: 10px; height: 10px; border-radius: 50%; background: #8fb3a1; }
  .sync.off .dot { background: #e05252; } .sync.saving .dot { background: #f0b03a; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 18px 16px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
  .lab { font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .pbtn { text-align: left; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: #fff; min-height: 70px; }
  .pbtn.on { border-color: var(--brand); background: var(--soft); }
  .pbtn b { display: block; font-size: 18px; }
  .pbtn small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .bar { height: 8px; border-radius: 99px; background: #e3ebe6; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  .bar.big { height: 14px; }
  .who h2 { margin: 0; font-size: 28px; }
  .who .sub { color: var(--muted); font-size: 16px; margin-top: 4px; }
  .badge { display: inline-block; background: var(--gold); color: var(--ink); font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 99px; margin-left: 8px; vertical-align: middle; }
  .stage { border: 2px solid var(--line); border-radius: 18px; background: #fff; margin-bottom: 14px; overflow: hidden; }
  .stage.cur { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(84,120,103,.15); }
  .shead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--soft); }
  .shead .ic { font-size: 24px; }
  .shead h3 { margin: 0; font-size: 19px; flex: 1; }
  .shead .st { font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: #fff; border: 2px solid var(--line); color: var(--muted); white-space: nowrap; }
  .shead .st.done { background: var(--brand); border-color: var(--brand); color: #fff; }
  .shead .st.now { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .skill { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); width: 100%; background: #fff; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; min-height: 60px; }
  .skill .ck { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; color: #fff; }
  .skill.ok .ck { background: var(--brand); border-color: var(--brand); }
  .skill .tx { flex: 1; font-size: 17px; }
  .skill .when { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .skill:disabled { cursor: default; color: inherit; }
  body.owner .skill { cursor: pointer; }
  body.owner .skill:not(.ok) .ck { border-color: var(--brand); border-style: dashed; }
  .ownerbar { position: sticky; top: 0; z-index: 5; background: var(--gold); padding: 10px 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ownerbar span { flex: 1; min-width: 200px; }
  .ownerbar button { min-height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: var(--ink); color: #fff; font-weight: 800; }
  .ownbtn { display: block; width: 100%; min-height: 58px; border-radius: 16px; border: 2px dashed var(--line); background: #fff; font-size: 17px; font-weight: 800; color: var(--muted); }
  .empty { color: var(--muted); font-size: 16px; padding: 6px 2px; }
  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(31,43,37,.5); padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 22px; padding: 24px; width: 100%; max-width: 440px; }
  .modal h3 { margin: 0 0 6px; font-size: 22px; }
  .modal p { margin: 0 0 14px; color: var(--muted); }
  .modal input { width: 100%; font-size: 20px; padding: 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); }
  .modal .row { display: flex; gap: 10px; margin-top: 14px; }
  .modal .row button { flex: 1; min-height: 54px; border-radius: 14px; font-weight: 800; font-size: 17px; border: 2px solid var(--line); background: #fff; }
  .modal .row .ok { background: var(--brand); border-color: var(--brand); color: #fff; }
  .modal .row .bad { background: #d64545; border-color: #d64545; color: #fff; }
  .modal .err { color: #b3261e; font-weight: 700; min-height: 1.3em; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--brand); color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }
  @media (max-width: 560px) { .people { grid-template-columns: 1fr 1fr; } .skill .when { display: none; } .skill.ok .tx small { display: block; } }
  .skill .tx small { display: none; font-size: 13px; color: var(--muted); }
</style>
</head>

><path d="M93.3,153.8c3.3,0,6.6,1,9.5,3.0-1.9,1.6-2.6,3.8-1.3,5.5-4.6,3.8-3.3,9.2,2.1,10.7h0c.03,2.4,1.1,3.9,3.7,4.0-.36.6-.77,1.3-1.2,2-3.1,4.3-8,6.6-12.9,6.6-3.4,0-6.8-1.0-9.7-3.3-6.3-4.9-8.0-14-3.9-20.8,3.0-5.0,8.3-7.6,13.8-7.6M94.5,163.8c.43,0,.85-.21,1.1-.6.4-.61.2-1.4-.39-1.8-.22-.14-.47-.21-.72-.21-.43,0-.85.2-1.1.6-.4.6-.22,1.4.39,1.8.22.1.47.2.72.2M87.3,166.4c.92,0,1.8-.54,2.2-1.5.3-.88.1-1.9-.55-2.6-.48-.46-1.0-.68-1.6-.68-.92,0-1.8.54-2.2,1.5-.36.8-.14,1.9.55,2.6.4.46,1.0.68,1.6.68M92.5,171.2c.45,0,.89-.22,1.1-.63.4-.64.2-1.4-.4-1.9-.23-.15-.49-.22-.75-.22-.45,0-.89.2-1.1.63-.42.6-.23,1.4.4,1.9.23.1.49.2.75.2M84.3,173.3c.42,0,.83-.16,1.1-.45.9-.88.6-2.4-.6-2.8-.17-.06-.35-.09-.54-.09-.42,0-.83.1-1.1.45-.93.8-.61,2.4.6,2.8.17.0.35.0.54.0M92.7,180.6c.59,0,1.1-.23,1.5-.67,1.1-1.1.7-2.9-.76-3.5-.26-.11-.54-.16-.81-.16-.59,0-1.1.23-1.5.67-1.1,1.1-.7,2.9.76,3.5.26.1.54.1.81.1M92.7,178.4s.02,0,.03,0c.03.0.04.0.04.0,0,.01,0,.03-.03.0,0,0,0,0,0,0,0,0-.02,0-.03,0h0s-.03-.03-.03-.04c0-.01,0-.03.0-.06,0,0,0,0,0,0h0Z"/><path d="M125.0,168.2l8.6-8.7-5.4-5.4-11.6,11.6v-11.0h-8.5v20.3l2.8.07-1.6,3.0c-.36.6-.78,1.3-1.2,2.0v4.7h8.5v-8.2l2.2-2.2,7.3,10.4h10.4l-11.6-16.6Z"/></svg><h1>🎓 Training</h1></div>
  <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Loading…</span></div>
</div></header>

<div class="wrap">
  <section class="card">
    <div class="lab">Whose training?</div>
    <div class="people" id="people"><div class="empty">Loading…</div></div>
  </section>
  <div id="detail"></div>
  <button type="button" class="ownbtn" id="ownerBtn">🔑 Owner sign-off</button>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = { ENDPOINT: "https://script.google.com/macros/s/AKfycbygeoLlirc5Ot1x6pK4_xFiqFNZ50jCy3Bx0TeJ8DaCH8_QKp8AoJr9bWvp-fMX78Nm/exec", TOKEN: "Bonnie" };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function toast(t) { $("toast").textContent = t; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200); }
function fmtDate(ms) { return new Date(ms).toLocaleDateString("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric" }); }

let DATA = ls.get("tccTraining", { stages: [], people: [] });
let sel = new URLSearchParams(location.search).get("who") || "";
try { if (!sel) sel = sessionStorage.getItem("tccTrainSel") || ""; } catch (e) {}
let ownerCode = "";
try { ownerCode = sessionStorage.getItem("tccTrainCode") || ""; } catch (e) {}
const fromOwner = new URLSearchParams(location.search).get("from") === "owner";
if (fromOwner) { $("backBtn").href = "owner.html"; $("backBtn").textContent = "← Owner"; }

async function post(body) {
  const res = await fetch(CONFIG.ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token: CONFIG.TOKEN }, body)) });
  return res.json();
}
function setSync(s, err) {
  $("sync").className = "sync" + (s === "ok" ? "" : " " + s);
  $("syncText").textContent = s === "saving" ? "Saving…" : s === "off" ? (err ? "Problem: " + err : "Offline") : "Synced";
}
async function load() {
  try {
    const r = await post({ action: "training" });
    if (r && r.ok) {
      DATA = { stages: r.stages || [], people: r.people || [] }; ls.set("tccTraining", DATA);
      if (Array.isArray(r.staff)) ls.set("tccStaff", r.staff);
      setSync("ok"); render();
    } else setSync("off", r && r.error);
  } catch (e) { setSync("off"); }
}

/* ---------- progress math ---------- */
function allSkills() { return DATA.stages.reduce((a, s) => a.concat(s.skills), []); }
function progress(p) {
  const done = p.done || {}, total = allSkills().length;
  const n = allSkills().filter(k => done[k.id]).length;
  const cur = DATA.stages.find(s => s.skills.some(k => !done[k.id]));
  return { n, total, pct: total ? Math.round(n * 100 / total) : 0, cur, finished: total > 0 && n === total };
}

/* ---------- render ---------- */
function render() {
  const people = DATA.people || [];
  $("people").innerHTML = people.length ? people.map(p => {
    const g = progress(p);
    return `<button type="button" class="pbtn ${p.name === sel ? "on" : ""}" data-p="${esc(p.name)}"><b>${esc(p.name)}</b>
      <small>${g.finished ? "🎓 Fully trained" : g.n === 0 ? "Not started" : esc(g.cur.icon + " " + g.cur.name) + " · " + g.pct + "%"}</small>
      <div class="bar"><i style="width:${g.pct}%"></i></div></button>`;
  }).join("") : `<div class="empty">No staff yet. Owners add names on the Owner page → Staff.</div>`;

  const p = people.find(x => x.name === sel);
  if (!p) { $("detail").innerHTML = people.length ? `<div class="card empty">Tap a name to see their training.</div>` : ""; return; }
  const g = progress(p), done = p.done || {};
  $("detail").innerHTML = `<section class="card who"><h2>${esc(p.name)}${g.finished ? `<span class="badge">🎓 Fully trained</span>` : ""}</h2>
      <div class="sub">${g.n} of ${g.total} skills signed off${g.finished ? "" : " · Working on: " + esc(g.cur.icon + " " + g.cur.name)}</div>
      <div class="bar big"><i style="width:${g.pct}%"></i></div></section>` +
    DATA.stages.map(st => {
      const n = st.skills.filter(k => done[k.id]).length, all = n === st.skills.length, isCur = g.cur && g.cur.id === st.id;
      return `<section class="stage ${isCur ? "cur" : ""}"><div class="shead"><span class="ic">${st.icon}</span><h3>${esc(st.name)}</h3>
        <span class="st ${all ? "done" : isCur ? "now" : ""}">${all ? "✓ Signed off" : isCur ? "Now · " + n + "/" + st.skills.length : n + "/" + st.skills.length}</span></div>` +
        st.skills.map(k => {
          const d = done[k.id];
          return `<button type="button" class="skill ${d ? "ok" : ""}" data-k="${k.id}" ${ownerCode ? "" : "disabled"}>
            <span class="ck">${d ? "✓" : ""}</span><span class="tx">${esc(k.t)}${d ? `<small>✓ ${fmtDate(d.at)}</small>` : ""}</span>
            <span class="when">${d ? "✓ " + fmtDate(d.at) : ""}</span></button>`;
        }).join("") + `</section>`;
    }).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-p]");
  if (b) { sel = b.dataset.p; try { sessionStorage.setItem("tccTrainSel", sel); } catch (x) {} render(); $("detail").scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  const k = e.target.closest("[data-k]");
  if (k && ownerCode) toggleSkill(k.dataset.k);
});

/* ---------- owner sign-off ---------- */
function setOwner(on) {
  document.body.classList.toggle("owner", on);
  $("ownerBar").hidden = !on; $("ownerBtn").hidden = on;
  if (!on) { ownerCode = ""; try { sessionStorage.removeItem("tccTrainCode"); } catch (e) {} }
  render();
}
function modal(html) { $("modal").innerHTML = html; $("overlay").classList.add("show"); }
function closeModal() { $("overlay").classList.remove("show"); }
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay" || e.target.closest("[data-close]")) closeModal(); });
$("ownerBtn").addEventListener("click", () => {
  modal(`<h3>🔑 Owner sign-off</h3><p>Only owners can sign off skills.</p>
    <input type="password" id="oc" placeholder="Owner code" autocapitalize="none" autocorrect="off">
    <div class="err" id="ocErr"></div>
    <div class="row"><button type="button" data-close>Cancel</button><button type="button" class="ok" id="ocGo">Continue</button></div>`);
  setTimeout(() => $("oc").focus(), 50);
  const go = async () => {
    const c = $("oc").value.trim(); if (!c) return;
    $("ocErr").textContent = "Checking…";
    try {
      const r = await post({ action: "owner", code: c, op: "check" });
      if (!r.ok) { $("ocErr").textContent = r.error === "Wrong owner code" ? "That's not the owner code." : r.error; return; }
      ownerCode = c; try { sessionStorage.setItem("tccTrainCode", c); } catch (e) {}
      closeModal(); setOwner(true);
    } catch (e) { $("ocErr").textContent = "No internet. Try again."; }
  };
  $("ocGo").onclick = go; $("oc").onkeydown = e => { if (e.key === "Enter") go(); };
});
$("ownerDone").addEventListener("click", () => { setOwner(false); if (fromOwner) location.href = "owner.html"; });

async function save(skill, on) {
  const p = DATA.people.find(x => x.name === sel); if (!p) return;
  p.done = p.done || {};
  if (on) p.done[skill] = { at: Date.now(), by: "Owner" }; else delete p.done[skill];
  render(); setSync("saving");
  try {
    const r = await post({ action: "owner", code: ownerCode, op: "trainSet", name: sel, skill, on });
    if (!r.ok) throw new Error(r.error);
    DATA = { stages: r.stages, people: r.people }; ls.set("tccTraining", DATA); setSync("ok");
    const np = DATA.people.find(x => x.name === sel);
    if (on && np && progress(np).finished) toast("🎓 " + sel + " is fully trained!"); else toast(on ? "Signed off ✓" : "Sign-off removed");
    render();
  } catch (e) { setSync("off", e.message); load(); }
}
function toggleSkill(skill) {
  const p = DATA.people.find(x => x.name === sel); if (!p) return;
  const d = (p.done || {})[skill];
  if (!d) return save(skill, true);
  const k = allSkills().find(x => x.id === skill);
  modal(`<h3>Remove this sign-off?</h3><p>${esc(k ? k.t : "")}<br>Signed off ${fmtDate(d.at)}.</p>
    <div class="row"><button type="button" data-close>Keep it</button><button type="button" class="bad" id="rmGo">Remove</button></div>`);
  $("rmGo").onclick = () => { closeModal(); save(skill, false); };
}

/* ---------- start ---------- */
render();
load();
if (ownerCode) {
  post({ action: "owner", code: ownerCode, op: "check" }).then(r => { if (r.ok) setOwner(true); else setOwner(false); }).catch(() => setOwner(true));
}
setInterval(() => { if (document.visibilityState === "visible" && !document.body.classList.contains("owner")) load(); }, 60000);
</script>
</body>
</html>
