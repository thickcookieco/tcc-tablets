<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Recipe Book</title>
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Matches the staff tablet pages: black logo header with a Kendal Green stripe, light background, rounded white cards. */
:root {
  --bg: #f5f8f6;
  --card: #ffffff;
  --ink: #1f2b25;
  --muted: #56665e;
  --line: #d3e0d9;
  --brand: #547867;
  --brand-dark: #46695a;
  --brand-soft: #eef4f0;
  --flag-bg: #fff3d1;
  --flag-line: #f0c060;
  --flag-ink: #6b4a00;
  --side-muted: #bccfc5;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
html { font-size: 18px; }
html[data-size="l"] { font-size: 21px; }
html[data-size="xl"] { font-size: 24px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #111; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
.shell { display: block; min-height: 100vh; }

/* ---------- header (same as the staff pages) ---------- */
.side { background: #111; color: #fff; border-bottom: 5px solid var(--brand); padding: 14px 16px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.side > * { max-width: 100%; }
.brand { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
.brand .mark { color: #fff; }
.brand .mark .logo { display: block; height: 22px; width: auto; }
.brand .mark img { display: block; max-height: 30px; width: auto; }
.brand .book { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
.sidefoot { display: flex; align-items: center; gap: 10px; }
.sidefoot p { display: none; }
.sizes { display: flex; gap: 6px; }
.sizebtn { min-height: 42px; min-width: 50px; padding: 0 10px; border: 2px solid #3a3a3a; background: #1d1d1d; color: #fff; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
.sizebtn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); }
.logoctl { display: none !important; }
nav { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nav { position: relative; display: flex; flex-direction: column; justify-content: center; min-height: 64px; padding: 8px 14px; border: 2px solid #3a3a3a; background: #1d1d1d; color: #fff; text-decoration: none; border-radius: 14px; }
.nav .nl { font-weight: 800; font-size: 18px; line-height: 1.15; }
.nav .ns { font-size: 13px; color: var(--side-muted); }
.nav .nf { position: absolute; top: -9px; right: 8px; background: #ffd23f; color: #3d2f00; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
.nav[aria-current="page"] { background: var(--brand); border-color: var(--brand); }
.nav[aria-current="page"] .ns { color: #e3efe8; }
.search { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.search input { width: 100%; min-height: 52px; border: 2px solid #3a3a3a; border-radius: 14px; background: #fff; color: var(--ink); padding: 0 16px; font-size: 18px; }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; max-height: 50vh; overflow-y: auto; }
.rbtn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: #1d1d1d; color: #fff; border: 2px solid #3a3a3a; border-radius: 12px; padding: 10px 14px; cursor: pointer; }
.rbtn .rn { font-weight: 800; font-size: 17px; }
.rbtn .rs { font-size: 13px; color: var(--side-muted); }
.rnone { color: var(--side-muted); font-size: 15px; }

/* ---------- main ---------- */
.main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: linear-gradient(160deg, #6a8f7d 0%, #547867 55%, #46695a 100%); color: #fff; border-radius: 20px; padding: 20px 22px; margin-bottom: 14px; }
.sechead h2 { font-size: 30px; font-weight: 800; line-height: 1.1; margin: 0; letter-spacing: -0.3px; }
.sechead .chip { background: rgba(255,255,255,.92); color: var(--ink); }
.sechead .ghost { display: none; }
.chip { display: inline-block; background: var(--brand); color: #fff; font-weight: 700; font-size: 14px; padding: 5px 12px; border-radius: 999px; }
.backtop { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; min-height: 56px; padding: 0 20px; border: none; border-radius: 999px; background: #ffd23f; color: #1f2b25; font-size: 17px; font-weight: 800; box-shadow: 0 6px 18px rgba(0,0,0,.22); cursor: pointer; display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .18s, transform .18s; }
.backtop.show { opacity: 1; transform: none; pointer-events: auto; }
.backtop:active { transform: scale(.97); }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.jbtn { min-height: 44px; padding: 0 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
.jbtn:active { background: var(--brand-soft); }
.cards { display: flex; flex-direction: column; gap: 18px; }

.card { border: 1px solid var(--line); border-radius: 20px; background: var(--card); overflow: hidden; scroll-margin-top: 12px; }
.cardhead { background: var(--brand); color: #fff; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.cardhead h3 { font-size: 24px; font-weight: 800; line-height: 1.15; margin: 0; }
.cardhead h3.missing { color: #ffd23f; }
.cardhead .chip { background: #fff; color: var(--brand-dark); }
.cardbody { padding: 18px; display: flex; flex-direction: column; gap: 20px; }

.flags { border: 2px solid var(--flag-line); background: var(--flag-bg); color: var(--flag-ink); border-radius: 14px; padding: 12px 16px; }
.flags h4 { margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.flags ul { margin: 0; padding-left: 20px; font-size: 16px; font-weight: 700; }
.flags li + li { margin-top: 2px; }

.top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.top.nophoto { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
h4.label { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }

.ings { list-style: none; margin: 0; padding: 0; }
.ings li { border-bottom: 1px solid var(--line); }
.ings li:last-child { border-bottom: none; }
label.ing { display: grid; grid-template-columns: 2.1rem 6.2rem minmax(0, 1fr); align-items: center; gap: 12px; min-height: 3.3rem; padding: 6px 2px; cursor: pointer; }
.ing .amt { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; color: var(--brand-dark); }
.ing .item { font-size: 1.1rem; overflow-wrap: anywhere; }
.amt.q, .item.q { background: var(--flag-bg); color: var(--flag-ink); padding: 2px 8px; border-radius: 8px; width: fit-content; font-size: 0.9rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.box { width: 2.1rem; height: 2.1rem; border: 3px solid var(--line); border-radius: 10px; background: #fff; position: relative; flex: none; }
input:checked + .box { background: var(--brand); border-color: var(--brand); }
input:checked + .box::after { content: ""; position: absolute; left: 0.58rem; top: 0.2rem; width: 0.48rem; height: 0.95rem; border: solid #fff; border-width: 0 4px 4px 0; transform: rotate(45deg); }
input:focus-visible + .box { outline: 3px solid var(--brand); outline-offset: 3px; }
input:checked ~ .amt, input:checked ~ .item { color: var(--muted); text-decoration: line-through; }
.empty { border: 2px dashed var(--line); border-radius: 16px; padding: 18px; color: var(--muted); font-size: 1rem; background: #fff; text-align: center; }

.photo { display: flex; flex-direction: column; gap: 8px; }
.frame { aspect-ratio: 4 / 3; width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--brand-soft); display: grid; place-items: center; overflow: hidden; position: relative; padding: 0; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
button.frame { cursor: zoom-in; }
.frame.none { border: 2px dashed var(--line); color: var(--muted); text-align: center; padding: 12px; font-size: 15px; }
.photo .cap { font-size: 14px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 48px; padding: 0 16px; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn.solid { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn:active { transform: scale(0.98); }
.status { font-size: 14px; font-weight: 700; color: var(--brand); min-height: 1.2rem; }
.status.err { color: #b3261e; }

.stepgroups { display: flex; flex-direction: column; gap: 14px; }
.sgroup { border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 4px; background: #fff; }
.sghead { display: flex; align-items: center; gap: 8px; padding: 4px 0 6px; border-bottom: 2px solid var(--brand); margin-bottom: 2px; }
.sghead h5 { margin: 0; font-size: 1rem; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; color: var(--brand-dark); }
.sgic { font-size: 1.2rem; }
.sgsub { margin-left: auto; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.shapebox { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 14px; align-items: center; }
.shapebox.noimg { grid-template-columns: 1fr; }
.shapepic { margin: 6px 0 10px; text-align: center; }
.shapepic img { width: 140px; height: 140px; border-radius: 14px; border: 1px solid var(--line); background: #fff; display: block; object-fit: cover; }
.shapepic figcaption { font-size: 0.85rem; font-weight: 800; color: var(--brand-dark); margin-top: 4px; line-height: 1.2; }
.notop { color: var(--muted); font-size: 1.05rem; padding: 12px 2px 14px; }
@media (max-width: 620px) {
  .shapebox { grid-template-columns: 1fr; gap: 0; }
  .shapepic { order: -1; display: flex; align-items: center; gap: 12px; margin: 8px 0 2px; text-align: left; }
  .shapepic img { width: 72px; height: 72px; }
  .shapepic figcaption { margin: 0; font-size: 0.95rem; }
}
.stepshead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.stepshead h4.label { margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: none; }
label.step { display: grid; grid-template-columns: 2.9rem minmax(0, 1fr); gap: 14px; align-items: start; padding: 12px 2px; min-height: 4rem; cursor: pointer; }
.num { width: 2.9rem; height: 2.9rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); border: 2px solid var(--brand); display: grid; place-items: center; font-weight: 900; font-size: 1.15rem; }
.num .ck { display: none; }
input:checked + .num { background: var(--brand); color: #fff; }
input:checked + .num .n { display: none; }
input:checked + .num .ck { display: inline; }
input:focus-visible + .num { outline: 3px solid var(--brand); outline-offset: 3px; }
.stx { font-size: 1.2rem; line-height: 1.45; padding-top: 0.35rem; overflow-wrap: anywhere; }
input:checked ~ .stx { color: var(--muted); }
.stx .sflag { display: inline-block; margin-top: 6px; background: var(--flag-bg); color: var(--flag-ink); font-size: 0.9rem; font-weight: 700; padding: 2px 8px; border-radius: 8px; }

.ings li.ingh { border-bottom: none; margin-top: 12px; }
.ingh-t { background: var(--brand-soft); color: var(--ink); font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 8px 12px; border-radius: 10px; }
.iflag { margin-top: 4px; background: var(--flag-bg); color: var(--flag-ink); font-size: 0.85rem; font-weight: 700; line-height: 1.3; padding: 2px 8px; border-radius: 8px; width: fit-content; max-width: 100%; }
.ingh .iflag { margin: 6px 0 0 4px; }
.ingtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 8px; }
.ingtop h4.label { margin: 0; }
.scaler { display: flex; gap: 6px; }
.scbtn { min-height: 44px; min-width: 52px; padding: 0 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; font-weight: 800; cursor: pointer; }
.scbtn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.scalenote { font-weight: 700; color: var(--brand-dark); margin: 0 0 8px; }
.scalenote:empty { display: none; }
.uses { margin-top: 14px; }
.usedin { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.usedin h4.label, .uses h4.label { margin: 0 0 6px; }
.usedin h4.label { margin: 0; }
.btn.xbtn { border-color: var(--brand); color: var(--brand-dark); background: var(--brand-soft); }
.xlink { font: inherit; font-weight: 700; color: var(--brand-dark); background: var(--brand-soft); border: 2px solid var(--brand); border-radius: 10px; padding: 0 8px; cursor: pointer; text-align: left; }
.backbar { display: flex; }
.pulse { outline: 4px solid var(--brand); outline-offset: 4px; }
.smedia { margin: 0 0 12px 4.1rem; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.smedia:empty { display: none; }
.smedia .row { width: 100%; align-items: stretch; }
.sthumb { display: block; width: 100%; max-width: 16rem; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: 14px; background: #111; object-fit: cover; padding: 0; overflow: hidden; }
button.sthumb { cursor: zoom-in; }
button.sthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pastebox { flex: 1; min-width: 12rem; min-height: 48px; border: 2px dashed var(--line); border-radius: 12px; padding: 0 12px; font-size: 15px; background: #fff; color: var(--ink); }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(31, 43, 37, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.lightbox img { max-width: 100%; max-height: calc(100vh - 8rem); object-fit: contain; border-radius: 16px; }
.lightbox .btn { background: #fff; }

@media (max-width: 760px) {
  nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top { grid-template-columns: minmax(0, 1fr); }
  .sechead h2 { font-size: 24px; }
}
@media (max-width: 480px) {
  label.ing { grid-template-columns: 2.1rem 5rem minmax(0, 1fr); gap: 8px; }
  label.step { grid-template-columns: 2.5rem minmax(0, 1fr); gap: 10px; }
  .num { width: 2.5rem; height: 2.5rem; font-size: 1rem; }
  .smedia { margin-left: 3.2rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* recipe photos */
.top { grid-template-columns: minmax(0, 1fr); }
.top.hasphoto { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.pmain { display: flex; flex-direction: column; gap: 8px; }
.pframe { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: 16px; background: var(--brand-soft); overflow: hidden; padding: 0; cursor: zoom-in; }
.pframe img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pstep { margin: 0 0 12px 4.1rem; max-width: 360px; }
.pstep .pframe { aspect-ratio: 4 / 3; }
.ploading { color: var(--muted); font-size: 0.9rem; padding: 10px; text-align: center; }
.pcap { font-size: 14px; color: var(--muted); }
.pctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
.pbtn { min-height: 46px; padding: 0 16px; border: none; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
.pbtn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }
.pstat { font-size: 14px; font-weight: 700; color: var(--brand-dark); }
.pbig { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.pbig img { max-width: 100%; max-height: 82vh; border-radius: 14px; }
.pbig.ask { background: rgba(17,17,17,.7); }
.askcard { background: #fff; border-radius: 20px; padding: 22px; width: 100%; max-width: 380px; }
.askcard h3 { margin: 0 0 4px; font-size: 22px; }
.askcard p { margin: 0 0 12px; color: var(--muted); }
.askcard input { width: 100%; font-size: 20px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); }
.askrow { display: flex; gap: 10px; margin-top: 12px; } .askrow .pbtn { flex: 1; }
.perr { color: #b3261e; font-weight: 700; min-height: 1.3em; margin-top: 8px; }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.row2 .lockbtn { margin: 0; }
#photoMode.on { background: #ffd23f; color: #1f2b25; border-color: #ffd23f; }
.pmnote { background: #ffd23f; color: #1f2b25; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; }
@media (max-width: 760px) { .top.hasphoto { grid-template-columns: minmax(0, 1fr); } .pstep { margin-left: 0; } }

/* made a batch */
.madebox { margin-top: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #f3effd; border: 2px solid #c9bdf5; border-radius: 16px; padding: 14px 16px; }
.madetxt { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 2px; }
.madetxt b { font-size: 1.05rem; }
.madetxt span { color: var(--muted); font-size: 0.95rem; }
.madebtn { min-height: 56px; padding: 0 22px; border: none; border-radius: 14px; background: #6c58d6; color: #fff; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
.madebtn:active { transform: scale(.98); }
.namechips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.card.flash { box-shadow: 0 0 0 4px #ffd23f; transition: box-shadow .3s; }

.menuback { display: inline-block; margin-top: 10px; color: #fff; text-decoration: none; font-weight: 800; font-size: 15px; padding: 9px 14px; border: 2px solid #3a3a3a; border-radius: 12px; background: #1d1d1d; }
.lockbtn { width: auto; padding: 0 14px; }
/* lock screen */
.lock { position: fixed; inset: 0; z-index: 100; background: #111; display: grid; place-items: center; padding: 20px; }
.lockcard { background: #fff; border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 420px; text-align: center; border-top: 6px solid var(--brand); }
.lockcard .logo { height: 14px; width: auto; color: #111; margin: 0 auto 14px; display: block; }
.lockcard h1 { margin: 0 0 6px; font-size: 26px; }
.lockcard p { margin: 0 0 16px; color: var(--muted); }
.lockcard input { width: 100%; font-size: 22px; padding: 14px; text-align: center; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); }
.lockcard button { width: 100%; min-height: 58px; margin-top: 12px; border: none; border-radius: 14px; background: var(--brand); color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; }
.lockcard .err { color: #b3261e; font-weight: 700; min-height: 1.4em; margin-top: 10px; }
.lockcard a { display: inline-block; margin-top: 14px; color: var(--brand); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

(function () {
  var KEY = "tccRecipeCode";
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function open(code) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(LOCKED.s), iterations: LOCKED.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCKED.i) }, key, b64(LOCKED.c));
    return new TextDecoder().decode(plain);
  }
  function run(js) {
    var s = document.createElement("script"); s.textContent = js; document.body.appendChild(s);
    document.getElementById("lock").hidden = true;
  }
  async function tryCode(code, quiet) {
    var btn = document.getElementById("unlockBtn"), err = document.getElementById("lockErr");
    btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
    try {
      var js = await open(code);
      try { localStorage.setItem(KEY, code); } catch (e) {}
      run(js);
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch (x) {}
      if (!quiet) err.textContent = window.crypto && crypto.subtle ? "That code isn't right. Try again." : "This browser can't open the recipe book.";
    }
    btn.disabled = false; btn.textContent = "Unlock";
  }
  document.getElementById("lockForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = document.getElementById("code").value;
    if (v.trim()) tryCode(v, false);
  });
  document.getElementById("lockBtn").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  });

  if (/prep\.html/.test(document.referrer)) { var mb = document.getElementById("menuBack"); mb.textContent = "← Prep List"; mb.href = "javascript:history.back()"; }
